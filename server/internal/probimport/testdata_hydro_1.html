<!DOCTYPE html>
<html lang="zh">
<head><meta charset="utf-8"><title>P1 · A+B Problem - 示例 Hydro</title></head>
<body>
<div class="section">
  <h1 class="section__title"><span class="problem-id">P1</span> <span class="title">A+B Problem</span></h1>
  <div class="section__body">
    <div class="problem__tag-container">
      <span class="problem__tag-item"><span class="icon icon-stopwatch"></span>1000ms</span>
      <span class="problem__tag-item"><span class="icon icon-comparison"></span>256MiB</span>
    </div>
    <div class="problem-content-container">
      <div class="problem-content" data-marker-enabled="">
        <p>输入两个整数 <span class="kdmath">$a$</span> 与 <span class="kdmath">$b$</span>，输出它们的和。</p>
        <h2>提示</h2>
        <p>注意 32 位整数范围。</p>
        <h2>样例 #1</h2>
        <p>输入：</p>
        <pre><code class="language-input1">1 2
</code></pre>
        <p>输出：</p>
        <pre><code class="language-output1">3
</code></pre>
        <h2>样例 #2</h2>
        <p>输入：</p>
        <pre><code class="language-input2">-5 7
</code></pre>
        <p>输出：</p>
        <pre><code class="language-output2">2
</code></pre>
      </div>
    </div>
  </div>
</div>
</body>
</html>
