<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="/vditor/dist/index.css"></head>
<body>
<div id="test"></div>
<pre id="out"></pre>
<script src="/vditor/dist/index.min.js"></script>
<script>
window.addEventListener('load', async () => {
  const out = [];
  const log = (s) => out.push(s);
  const Vditor = window.Vditor;
  const div = document.getElementById('test');
  const md = '输入 $a$ 与 $-2147483648 \\sim 2147483647$ 测试';

  const katexCount = () => div.querySelectorAll('.katex').length;

  // 第一遍：preview（引擎首次注入，resolve 时公式还是原始 span）
  await Vditor.preview(div, md, { cdn: '/vditor' });
  log('preview resolve 后 katex 数: ' + katexCount());

  // 模拟 DOMPurify innerHTML 重写（节点引用全毁）
  div.innerHTML = div.innerHTML;
  log('innerHTML 重写后 katex 数: ' + katexCount());

  // 立即调 mathRender，分时刻观测
  const t0 = performance.now();
  Vditor.mathRender(div, { cdn: '/vditor' });
  log('mathRender 同步返回时 katex 数: ' + katexCount());
  for (const ms of [0, 50, 200, 600]) {
    await new Promise((r) => setTimeout(r, ms === 0 ? 1 : ms));
    log('+' + ms + 'ms katex 数: ' + katexCount());
  }

  // 稳态测试：引擎已就绪后，再次 innerHTML 重写 + mathRender（模拟第二篇文档渲染）
  await new Promise((r) => setTimeout(r, 500));
  div.innerHTML = div.innerHTML;
  const before = katexCount();
  Vditor.mathRender(div, { cdn: '/vditor' });
  log('稳态: 重写后 ' + before + ' → mathRender 同步返回 ' + katexCount());

  document.getElementById('out').textContent = out.join('\n');
  document.title = 'DONE';
});
</script>
</body></html>
