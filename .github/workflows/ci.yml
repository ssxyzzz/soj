# 最小 CI 门禁（v0.28 工程化批）：与本地 make check 完全同一入口——
# go vet (+staticcheck 如有) + go test + eslint + vue-tsc + vite build。
# repo 包测试需要 Mongo，CI 无 Mongo 时按既有约定整文件 skip（本地/真机跑全量）。
name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: 全量门禁（lint + test + typecheck + build）
        run: make check
